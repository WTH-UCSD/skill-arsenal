interface:
  display_name: "Robinhood Weekly Investing"
  short_description: "AI-theme weekly research, ticker library, and HTML trade cockpit"
  default_prompt: "Use $robinhood-weekly-investing to review the Agentic portfolio, maintain public ticker research dossiers, screen AI and technology opportunities, and create a five-minute HTML decision cockpit with review-only trade proposals."

dependencies:
  tools:
    - type: "mcp"
      value: "robinhood"
      description: "Robinhood brokerage data, order review, and user-approved equity order placement"
      transport: "streamable_http"
      url: "https://agent.robinhood.com/mcp/trading"

policy:
  allow_implicit_invocation: true
